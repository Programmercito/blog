<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">

{% include head.html %}

<body>

  <!-- 1. Header (Repository Mockup) -->
  <header class="site-header">
    <div class="header-container">
      <div class="header-top">
        <div class="site-logo">
          <a href="{{ '/' | relative_url }}">
            <span class="owner">programmercito</span><span class="separator">/</span><span class="repo">blog</span>
          </a>
        </div>
        <div class="git-badge">
          <!-- git branch SVG icon -->
          <svg viewBox="0 0 16 16" version="1.1" aria-hidden="true">
            <path fill-rule="evenodd" d="M11.75 2.5a.75.75 0 100-1.5.75.75 0 000 1.5zm-2.25.75a2.25 2.25 0 113 2.122V6A2.5 2.5 0 0110 8.5H6a.5.5 0 00-.5.5v1.128a2.251 2.251 0 11-1.5 0V5.372a2.25 2.25 0 111.5 0v1.628A1 1 0 016.5 8h4a1 1 0 001-1v-.628A2.25 2.25 0 019.5 3.25zM4.25 12a.75.75 0 100-1.5.75.75 0 000 1.5zM3.5 3.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0z"></path>
          </svg>
          <span>main</span>
        </div>
      </div>
      
      <div class="site-nav">
        <ul class="nav-links">
          <li>
            <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">
              README.md
            </a>
          </li>
          <li>
            <span class="nav-file-tab {% if page.url == '/archive.html' or page.url == '/archive/' %}active{% endif %}">
              archive.html
            </span>
          </li>
        </ul>
        
        <div class="nav-socials">
          {%- for item in site.external -%}
            <a href="{{ item.url }}" title="{{ item.title }}" target="_blank" rel="noopener noreferrer">
              {%- if item.icon -%}
                <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: currentColor; display: block;">
                  {%- if item.icon == 'github' -%}
                    <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                  {%- elsif item.icon == 'envelope' -%}
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                  {%- elsif item.icon == 'rss' -%}
                    <path d="M6.18 15.64a2.18 2.18 0 11-4.36 0 2.18 2.18 0 014.36 0zM2 9.34A6.66 6.66 0 018.66 16H6.13c0-2.28-1.85-4.13-4.13-4.13V9.34zM2 3a13 13 0 0113 13h-2.5A10.5 10.5 0 002 5.5V3z"/>
                  {%- endif -%}
                </svg>
              {%- else -%}
                {{ item.title }}
              {%- endif -%}
            </a>
          {%- endfor -%}
        </div>
      </div>
    </div>
  </header>

  <!-- 2. Workspace Layout with Left Gutter -->
  <div class="workspace-container">
    <!-- Left Gutter for Line Numbers -->
    <div class="line-gutter">
      <!-- Populated dynamically by sketchbook.js -->
    </div>
    
    <!-- Main Content Area -->
    <main class="main-content">
      {{ content }}
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-container">
      <p>// Powered by Jekyll &amp; Ruby | Designed as Code Sketchbook | <a href="https://devcito.org" target="_blank" rel="noopener noreferrer" style="color: var(--color-orange);">Hecho con ❤️ por devcito</a></p>
    </div>
  </footer>

  <!-- Load Interactive Scripts -->
  <script src="{{ "/assets/js/sketchbook.js" | relative_url }}"></script>
</body>
</html>
