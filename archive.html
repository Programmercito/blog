---
title: "Archive"
layout: default
file: "archive.html"
---

<div class="file-info-bar">
  <svg viewBox="0 0 16 16" version="1.1" aria-hidden="true">
    <path fill-rule="evenodd" d="M3 1.75C3 .784 3.784 0 4.75 0h6.5A1.75 1.75 0 0113 1.75v12.5A1.75 1.75 0 0111.25 16H4.75A1.75 1.75 0 013 14.25V1.75zM4.75 1.5a.25.25 0 00-.25.25v12.5c0 .138.112.25.25.25h6.5a.25.25 0 00.25-.25V1.75a.25.25 0 00-.25-.25h-6.5z"></path>
    <path fill-rule="evenodd" d="M11 5H5V3.5h6V5zm0 3H5V6.5h6V8zm0 3H5V9.5h6V11z"></path>
  </svg>
  <span class="file-path">archive.html</span>
</div>

<article>
  <h1>Archive <span class="title-comment">// total_posts: {{ site.posts | size }}</span></h1>
  
  <div class="archive-list" style="margin-top: 2rem;">
    {% for post in site.posts %}
      <div class="archive-item" data-tags="{% for tag in post.tags %}{{ tag }} {% endfor %}">
        <time class="archive-date" datetime="{{ post.date | date_to_xmlschema }}">
          {{ post.date | date: "%Y-%m-%d" }}
        </time>
        <a class="archive-title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </div>
    {% endfor %}
  </div>
</article>

<script>
  // Simple tag filtering if tag parameter is present in URL
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const tag = params.get('tag');
    if (tag) {
      // Update title comment
      const titleComment = document.querySelector('.title-comment');
      if (titleComment) {
        titleComment.textContent = `// tag: #${tag}`;
      }
      
      // Filter list
      const items = document.querySelectorAll('.archive-item');
      items.forEach(item => {
        const tags = item.getAttribute('data-tags') || '';
        if (tags.split(' ').includes(tag)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    }
  });
</script>
